name: Cleanup workflow artifacts

on:
  workflow_run:
    workflows:
      - 'Smoke and SEO'
      - 'pages-build-deployment'
      - 'pages build and deployment'
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed workflow run ID to clean'
        required: true
        type: string

permissions:
  actions: write

concurrency:
  group: cleanup-artifacts-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: never execute code from the completed run with this write token.
      - name: Delete all artifacts from the completed run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected a positive workflow run ID.'
            exit 1
          fi

          status=$(gh api "repos/$GH_REPO/actions/runs/$TARGET_RUN_ID" --jq '.status')
          if [[ "$status" != 'completed' ]]; then
            echo "Run $TARGET_RUN_ID is $status; leaving its artifacts untouched."
            exit 0
          fi

          # Read every page before deleting, so pagination cannot skip artifacts.
          artifact_ids=$(gh api \
            "repos/$GH_REPO/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100" \
            --paginate --jq '.artifacts[].id')
          deleted=0
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
            deleted=$((deleted + 1))
            echo "Deleted artifact $artifact_id"
          done <<< "$artifact_ids"

          echo "Deleted $deleted artifact(s) from run $TARGET_RUN_ID."
          echo "Deleted $deleted artifact(s) from completed run $TARGET_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
