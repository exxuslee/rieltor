name: Smoke and SEO

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: rieltor-pages
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Smoke check
        run: node docs/scripts/check-smoke.mjs
      - name: SEO check
        run: node docs/scripts/check-seo.mjs

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          retention-days: 1
      - name: Deploy tagged website
        id: deployment
        uses: actions/deploy-pages@v4
