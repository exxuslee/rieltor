name: Smoke and SEO

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Smoke check
        run: node docs/scripts/check-smoke.mjs
      - name: SEO check
        run: node docs/scripts/check-seo.mjs
